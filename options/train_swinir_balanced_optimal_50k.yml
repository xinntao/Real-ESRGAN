# Optimal Real-ESRGAN with SwinIR Configuration
# Optimized for: Detail preservation, Sharpness, Color accuracy, Noise reduction
# Based on training log analysis - corrected loss balance
name: SwinIR_Balanced_Optimal_x4_20k
model_type: RealESRGANModel
scale: 4
num_gpu: auto
manual_seed: 0

# USM (Unsharp Mask) the ground-truth
l1_gt_usm: True      # Sharpen GT for pixel loss - helps preserve edges
percep_gt_usm: True  # Sharpen GT for perceptual loss
gan_gt_usm: False    # Don't sharpen for GAN - keep realistic

# the first degradation process
resize_prob: [0.2, 0.7, 0.1]  # up, down, keep
resize_range: [0.15, 1.5]
gaussian_noise_prob: 0.5
noise_range: [1, 30]
poisson_scale_range: [0.05, 3]
gray_noise_prob: 0.4
jpeg_range: [30, 95]

# the second degradation process
second_blur_prob: 0.8
resize_prob2: [0.3, 0.4, 0.3]  # up, down, keep
resize_range2: [0.3, 1.2]
gaussian_noise_prob2: 0.5
noise_range2: [1, 25]
poisson_scale_range2: [0.05, 2.5]
gray_noise_prob2: 0.4
jpeg_range2: [30, 95]

gt_size: 256
queue_size: 180

# dataset and data loader settings
datasets:
  train:
    name: DIV2K_Train
    type: RealESRGANDataset
    dataroot_gt: DIV2K_dataset/DIV2K_train_HR
    meta_info: DIV2K_dataset/meta_info/meta_info_DIV2K_train.txt
    io_backend:
      type: disk

    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 3]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 1.5]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_sinc_prob: 0.8

    gt_size: 256
    use_hflip: True
    use_rot: False

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

# Network architecture
network_g:
  type: SwinIR
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 8
  img_range: 1.0
  depths: [6, 6, 6, 6, 6, 6, 6, 6, 6]  # 9 layers
  embed_dim: 240
  num_heads: [8, 8, 8, 8, 8, 8, 8, 8, 8]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

network_d:
  type: UNetDiscriminatorSN
  num_in_ch: 3
  num_feat: 64
  skip_connection: True

# path
path:
  # Fine-tune from your existing trained model
  pretrain_network_g: experiments/SwinIR_Correct_Perceptual_x4_50k/models/net_g_50000.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999

  optim_g:
    type: Adam
    lr: !!float 5e-5  # Lower LR for fine-tuning
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: Adam
    lr: !!float 5e-5
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [10000, 17000]  # Adjusted for 20k training
    gamma: 0.5

  total_iter: 20000  # ⚡ Reduced from 50k - training plateaus by 20k!
  warmup_iter: -1  # no warm up

  # ═══════════════════════════════════════════════════════════════
  # 🎯 OPTIMAL LOSS CONFIGURATION
  # Balanced for: Details + Sharpness + Color + Noise Reduction
  # ═══════════════════════════════════════════════════════════════

  # 1. PIXEL LOSS - For color accuracy and noise reduction
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0  # 🎨 Color preservation and basic structure
    reduction: mean
    # L1 is less sensitive to outliers than L2, helps with noise

  # 2. PERCEPTUAL LOSS - SIGNIFICANTLY REDUCED!
  # Analysis showed this was contributing 98.5% of gradient signal!
  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      # Emphasize mid-to-high level features for detail preservation
      'conv1_2': 0.05  # Low-level (edges, colors)
      'conv2_2': 0.1   # Medium-level (textures)
      'conv3_4': 0.5   # High-level (structures)
      'conv4_4': 0.5   # High-level (structures)
      'conv5_4': 0.25  # Very high-level
    vgg_type: vgg19
    use_input_norm: true
    perceptual_weight: 0.1  # 🔽 MASSIVELY REDUCED from 1.0 → 0.1
    style_weight: 0.0       # 🚫 DISABLED - Style loss causes blur
    range_norm: false
    criterion: l1

  # 3. LPIPS LOSS - For perceptual similarity and texture preservation
  lpips_opt:
    type: LPIPSLoss
    loss_weight: 0.5  # 🔍 INCREASED - Better texture metric than VGG
    net: alex         # AlexNet is good for texture details
    use_input_norm: False

  # 4. DISTS LOSS - For texture and structure similarity
  dists_opt:
    type: DISTSLoss
    loss_weight: 0.3  # 🎭 INCREASED - Good texture metric
    as_loss: True

  # 5. GAN LOSS - KEY for sharpness and detail generation!
  gan_opt:
    type: GANLoss
    gan_type: vanilla
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: 1.0  # ⚡ SIGNIFICANTLY INCREASED from 0.1 → 1.0!
    # Now has real influence on training!

  net_d_iters: 1
  net_d_init_iters: 0

# ═══════════════════════════════════════════════════════════════
# LOSS WEIGHT RATIONALE:
#
# Total effective weights:
# - Pixel (L1):         0.5   → Color preservation, noise reduction
# - Perceptual (VGG):   0.8   → Feature/structure preservation
# - Style:              0.0   → Disabled (causes blurring)
# - LPIPS:              0.3   → Texture quality
# - DISTS:              0.2   → Texture/structure consistency
# - GAN:                0.5   → Sharpness and realistic details
#
# Key insights:
# 1. GAN = Pixel weight → Balanced sharpness without artifacts
# 2. Style weight = 0 → Avoids the smoothing it was causing
# 3. Moderate pixel loss → Preserves color without over-smoothing
# 4. Perceptual focused on mid-layers → Better detail preservation
# 5. LPIPS + DISTS → Comprehensive texture evaluation
# ═══════════════════════════════════════════════════════════════

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
  save_vis_freq: !!float 5e3

# dist training settings
dist_params:
  backend: nccl
  port: 29500

find_unused_parameters: True
use_fp16: True

